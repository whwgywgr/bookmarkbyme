name: Deploy BookmarkByME to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bookmarkbyme/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: bookmarkbyme/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bookmarkbyme/package-lock.json') }}
          restore-keys: ${{ runner.os }}-nextjs-
      - name: Install dependencies
        run: npm ci
        working-directory: bookmarkbyme
      - name: Build with Next.js
        run: npm run build
        working-directory: bookmarkbyme
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bookmarkbyme/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
