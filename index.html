<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BookmarkByME · Pengurus Link</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>" />
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-100 via-blue-50 to-sky-50 text-slate-800">

<header class="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-sky-200">
  <div class="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center gap-2.5">
    <div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-200 shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/></svg>
    </div>
    <div class="mr-auto">
      <h1 class="font-bold text-base text-blue-900 leading-tight">BookmarkByME</h1>
      <p class="text-[11px] text-sky-600" id="stats">0 link · 0 kategori</p>
    </div>

    <div class="relative w-full sm:w-56 order-last sm:order-none">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-sky-400 pointer-events-none"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.34-4.34m0 0A7 7 0 1 0 6.56 6.56a7 7 0 0 0 10.1 10.1Z"/></svg>
      <input id="search" type="text" placeholder="Cari link…" class="w-full rounded-xl border border-sky-200 bg-sky-50/60 pl-9 pr-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400" />
    </div>

    <button id="btnImport" title="Import backup (JSON) / bookmarks browser (HTML)" class="p-1.5 rounded-xl text-sky-500 hover:text-blue-600 hover:bg-sky-100 transition">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5"/></svg>
    </button>
    <div class="relative">
      <button id="btnExport" title="Eksport" class="p-1.5 rounded-xl text-sky-500 hover:text-blue-600 hover:bg-sky-100 transition">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
      </button>
      <div id="exportMenu" class="hidden absolute right-0 top-full mt-1.5 bg-white rounded-xl shadow-xl border border-sky-100 py-1.5 min-w-max z-50">
        <button data-exp="json" class="w-full text-left px-4 py-2 text-sm text-slate-600 hover:bg-sky-50 hover:text-blue-600 transition flex items-center gap-2">
          <span class="font-semibold text-[11px] bg-sky-100 text-sky-700 rounded px-1.5 py-0.5">JSON</span> Backup penuh
        </button>
        <button data-exp="html" class="w-full text-left px-4 py-2 text-sm text-slate-600 hover:bg-sky-50 hover:text-blue-600 transition flex items-center gap-2">
          <span class="font-semibold text-[11px] bg-sky-100 text-sky-700 rounded px-1.5 py-0.5">HTML</span> Bookmarks browser
        </button>
      </div>
    </div>
    <button id="btnAdd" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium shadow-md shadow-blue-200 transition">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-3.5 h-3.5"><path stroke-linecap="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      Link Baharu
    </button>
  </div>
</header>

<div class="max-w-7xl mx-auto px-4 py-3 flex gap-4 items-start">
  <aside class="hidden lg:flex flex-col shrink-0 w-56 sticky top-16 max-h-[calc(100vh-5rem)] overflow-y-auto">
    <p class="px-3 mb-1.5 text-[11px] font-semibold uppercase tracking-wider text-sky-500">Kategori</p>
    <nav id="catNav" class="flex flex-col gap-0.5"></nav>
  </aside>
  <main class="flex-1 min-w-0">
    <div id="chips" class="flex lg:hidden gap-1.5 mb-3 overflow-x-auto pb-1"></div>
    <div id="grid" class="flex flex-wrap gap-2"></div>
  </main>
</div>

<footer class="max-w-7xl mx-auto px-4 pb-4 text-center text-[11px] text-sky-500">
  Data disimpan secara peribadi dalam pelayar anda (localStorage). Eksport: backup JSON, atau fail bookmarks HTML untuk Chrome/Edge/Firefox.<br />
  Tip: <kbd class="px-1 py-0.5 bg-white border border-sky-200 rounded text-[10px] font-semibold">Ctrl</kbd>+klik link untuk buka di tab belakang terus tanpa pindah tumpuan.
</footer>

<div id="modal" class="hidden fixed inset-0 z-40 flex items-center justify-center p-4">
  <div id="modalBg" class="absolute inset-0 bg-blue-900/40 backdrop-blur-sm"></div>
  <form id="linkForm" class="relative bg-white w-full max-w-md rounded-2xl shadow-2xl p-5 space-y-3">
    <h2 id="modalTitle" class="text-base font-bold text-blue-900">Link Baharu</h2>
    <div>
      <label for="fUrl" class="block text-xs font-medium text-slate-600 mb-1">URL <span class="text-red-400">*</span></label>
      <input id="fUrl" type="text" required placeholder="contoh.com" class="w-full rounded-xl border border-sky-200 bg-sky-50/50 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400" />
    </div>
    <div>
      <label for="fName" class="block text-xs font-medium text-slate-600 mb-1">Nama</label>
      <input id="fName" type="text" placeholder="Nama link (auto jika kosong)" class="w-full rounded-xl border border-sky-200 bg-sky-50/50 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400" />
    </div>
    <div>
      <label for="fCat" class="block text-xs font-medium text-slate-600 mb-1">Kategori</label>
      <input id="fCat" type="text" list="catList" placeholder="cth: Kerja, Sosial, Pembelajaran" class="w-full rounded-xl border border-sky-200 bg-sky-50/50 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400" />
      <datalist id="catList"></datalist>
    </div>
    <div class="flex justify-end gap-2 pt-1">
      <button type="button" id="btnCancel" class="px-4 py-2 rounded-xl text-slate-500 hover:bg-sky-50 transition">Batal</button>
      <button type="submit" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-medium shadow-md shadow-blue-200 transition">Simpan</button>
    </div>
  </form>
</div>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-blue-900 text-white text-sm px-4 py-2 rounded-xl shadow-lg opacity-0 translate-y-2 transition-all pointer-events-none"></div>
<input id="fileImport" type="file" accept=".json,.html,.htm,application/json,text/html" class="hidden" />

<script>
const KEY = 'bookmarkbyme_v1';
const OLD_KEY = 'linkhub_v1';
const state = { links: [] };
let activeCat = '__all';
let query = '';
let editingId = null;

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const normUrl = u => { u = u.trim(); return /^https?:\/\//i.test(u) ? u : 'https://' + u; };
const domain = u => { try { return new URL(normUrl(u)).hostname; } catch { return u; } };
const pretty = u => normUrl(u).replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/$/, '');
const favicon = u => 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(domain(u)) + '&sz=64';
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const catOf = l => l.category || 'Tanpa Kategori';

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(d?.links)) state.links = d.links;
  } catch {}
  if (!state.links.length) {
    try {
      const d = JSON.parse(localStorage.getItem(OLD_KEY));
      if (Array.isArray(d?.links) && d.links.length) {
        state.links = d.links;
        save();
      }
    } catch {}
  }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

function cats() {
  const set = new Set(state.links.map(catOf));
  return [...set].sort((a, b) => a.localeCompare(b));
}

function chipHtml(label, val, count) {
  const active = activeCat === val;
  return `<button data-cat="${esc(val)}" class="shrink-0 whitespace-nowrap px-2.5 py-1 rounded-full text-xs border transition ${active
    ? 'bg-blue-600 text-white border-blue-600 shadow-md shadow-blue-200'
    : 'bg-white text-slate-600 border-sky-200 hover:border-blue-400 hover:text-blue-600'}">${esc(label)} <span class="opacity-60">${count}</span></button>`;
}

function navItemHtml(label, val, count) {
  const active = activeCat === val;
  return `<button data-cat="${esc(val)}" title="${esc(label)}" class="w-full flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm text-left transition ${active
    ? 'bg-blue-600 text-white shadow-md shadow-blue-200'
    : 'text-slate-600 hover:bg-sky-100 hover:text-blue-700'}">
    <span class="min-w-0 break-words leading-snug">${esc(label)}</span>
    <span class="ml-auto shrink-0 text-xs px-1.5 py-0.5 rounded-md ${active ? 'bg-white/20' : 'bg-sky-100 text-sky-600'}">${count}</span>
  </button>`;
}

function cardHtml(l) {
  const letter = (l.name || domain(l.url) || '?').trim().charAt(0).toUpperCase();
  const color = `hsl(${hue(l.name || l.url)} 70% 55%)`;
  const href = esc(normUrl(l.url));
  return `
  <div class="group relative bg-white/90 border border-sky-100 rounded-xl p-2.5 shadow-sm hover:shadow-md hover:border-sky-300 hover:-translate-y-0.5 transition-all flex items-center gap-2.5 max-w-full overflow-hidden">
    <div class="relative w-7 h-7 shrink-0">
      <div class="absolute inset-0 rounded-md flex items-center justify-center text-white text-xs font-bold select-none" style="background:${color}">${esc(letter)}</div>
      <img src="${favicon(l.url)}" alt="" class="relative w-7 h-7 rounded-md object-contain bg-white" onerror="this.style.display='none'" />
    </div>
    <div class="min-w-0">
      <a href="${href}" target="_blank" rel="noopener noreferrer" title="${esc(pretty(l.url))}" class="block text-sm font-semibold text-slate-800 hover:text-blue-600">${esc(l.name)}</a>
    </div>
    <div class="flex gap-0.5 sm:static absolute top-1 right-1 sm:opacity-0 sm:group-hover:opacity-100 sm:focus-within:opacity-100 transition-opacity bg-white/80 sm:bg-transparent rounded-lg sm:rounded-none">
      <button data-act="edit" data-id="${esc(l.id)}" title="Edit" class="p-1 rounded-md text-slate-400 hover:text-blue-600 hover:bg-sky-100 transition">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5m-1.414-9.414a2 2 0 1 1 2.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
      </button>
      <button data-act="del" data-id="${esc(l.id)}" title="Buang" class="p-1 rounded-md text-slate-400 hover:text-red-500 hover:bg-red-50 transition">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673A2.25 2.25 0 0 1 15.916 21.75h-7.832a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
      </button>
    </div>
  </div>`;
}

function render() {
  const all = cats();
  $('#stats').textContent = `${state.links.length} link · ${all.length} kategori`;
  $('#catList').innerHTML = all.map(c => `<option value="${esc(c)}"></option>`).join('');
  const navAll = navItemHtml('Semua', '__all', state.links.length) +
    all.map(c => navItemHtml(c, c, state.links.filter(l => catOf(l) === c).length)).join('');
  $('#catNav').innerHTML = navAll;
  $('#chips').innerHTML = chipHtml('Semua', '__all', state.links.length) +
    all.map(c => chipHtml(c, c, state.links.filter(l => catOf(l) === c).length)).join('');

  const q = query.trim().toLowerCase();
  const list = state.links.filter(l => {
    if (activeCat !== '__all' && catOf(l) !== activeCat) return false;
    if (q && !(l.name.toLowerCase().includes(q) || l.url.toLowerCase().includes(q) || catOf(l).toLowerCase().includes(q))) return false;
    return true;
  });

  const empty = state.links.length === 0
    ? `<div class="w-full text-center py-12">
         <div class="text-4xl mb-2">🔗</div>
         <p class="font-semibold text-blue-900">Belum ada link</p>
         <p class="text-sm text-sky-600 mt-1">Klik butang <span class="font-medium">+ Link Baharu</span> untuk mula simpan link anda.</p>
       </div>`
    : list.length === 0
      ? `<div class="w-full text-center py-12">
           <div class="text-3xl mb-2">🔍</div>
           <p class="font-medium text-blue-900">Tiada hasil dijumpai</p>
           <p class="text-sm text-sky-600 mt-1">Cuba kata kunci atau kategori lain.</p>
         </div>`
      : list.map(cardHtml).join('');

  $('#grid').innerHTML = empty;
}

function openModal(id = null) {
  editingId = id;
  const l = id ? state.links.find(x => x.id === id) : null;
  $('#fUrl').value = l ? l.url : '';
  $('#fName').value = l ? l.name : '';
  $('#fCat').value = l ? l.category : '';
  $('#modalTitle').textContent = l ? 'Edit Link' : 'Link Baharu';
  $('#modal').classList.remove('hidden');
  $('#fUrl').focus();
}
function closeModal() {
  $('#modal').classList.add('hidden');
  editingId = null;
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('opacity-0', 'translate-y-2');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('opacity-0', 'translate-y-2'), 2000);
}

$('#btnAdd').addEventListener('click', () => openModal());
$('#btnCancel').addEventListener('click', closeModal);
$('#modalBg').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal(); });

$('#linkForm').addEventListener('submit', e => {
  e.preventDefault();
  const url = normUrl($('#fUrl').value);
  const name = $('#fName').value.trim() || domain(url);
  const category = $('#fCat').value.trim() || 'Tanpa Kategori';
  if (editingId) {
    Object.assign(state.links.find(x => x.id === editingId), { name, url, category });
    toast('Link dikemaskini');
  } else {
    state.links.unshift({ id: uid(), name, url, category });
    toast('Link ditambah');
  }
  save();
  render();
  closeModal();
});

for (const sel of ['#chips', '#catNav']) {
  $(sel).addEventListener('click', e => {
    const b = e.target.closest('button[data-cat]');
    if (!b) return;
    activeCat = b.dataset.cat;
    render();
  });
}

$('#grid').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === 'edit') {
    openModal(id);
  } else if (confirm('Buang link ini?')) {
    state.links = state.links.filter(l => l.id !== id);
    save();
    render();
    toast('Link dibuang');
  }
});

$('#search').addEventListener('input', e => { query = e.target.value; render(); });

const exportMenu = $('#exportMenu');
$('#btnExport').addEventListener('click', e => {
  e.stopPropagation();
  exportMenu.classList.toggle('hidden');
});
document.addEventListener('click', e => {
  if (!exportMenu.classList.contains('hidden') && !exportMenu.contains(e.target)) exportMenu.classList.add('hidden');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') exportMenu.classList.add('hidden'); });

function download(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function buildBookmarksHtml() {
  const groups = new Map();
  for (const l of state.links) {
    const c = catOf(l);
    if (!groups.has(c)) groups.set(c, []);
    groups.get(c).push(l);
  }
  let html = '<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n';
  for (const [cat, links] of groups) {
    html += '    <DT><H3>' + esc(cat) + '</H3>\n    <DL><p>\n';
    for (const l of links) html += '        <DT><A HREF="' + esc(normUrl(l.url)) + '">' + esc(l.name) + '</A>\n';
    html += '    </DL><p>\n';
  }
  html += '</DL><p>\n';
  return html;
}

exportMenu.addEventListener('click', e => {
  const b = e.target.closest('button[data-exp]');
  if (!b) return;
  exportMenu.classList.add('hidden');
  if (!state.links.length) return toast('Tiada link untuk dieksport');
  const date = new Date().toISOString().slice(0, 10);
  if (b.dataset.exp === 'json') {
    download('bookmarkbyme-backup-' + date + '.json', JSON.stringify({ app: 'bookmarkbyme', exportedAt: new Date().toISOString(), links: state.links }, null, 2), 'application/json');
    toast('Backup JSON dimuat turun');
  } else {
    download('bookmarkbyme-bookmarks-' + date + '.html', buildBookmarksHtml(), 'text/html');
    toast('Fail bookmarks HTML dimuat turun');
  }
});

function parseBookmarksHtml(text) {
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const out = [];
  const walk = (dl, cat) => {
    if (!dl) return;
    for (const node of dl.children) {
      if (node.tagName !== 'DT') continue;
      const h3 = node.querySelector(':scope > h3');
      const a = node.querySelector(':scope > a');
      if (h3) {
        const sub = node.querySelector(':scope > dl') ||
          (node.nextElementSibling && node.nextElementSibling.tagName === 'DL' ? node.nextElementSibling : null);
        walk(sub, h3.textContent.trim() || cat);
      } else if (a && a.getAttribute('href')) {
        out.push({ name: a.textContent.trim(), url: a.getAttribute('href'), category: cat });
      }
    }
  };
  walk(doc.querySelector('dl'), 'Tanpa Kategori');
  return out;
}

$('#btnImport').addEventListener('click', () => $('#fileImport').click());
$('#fileImport').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const text = String(r.result);
    const isHtml = /<!DOCTYPE NETSCAPE|<dt>\s*<a\s/i.test(text) || (/<dl/i.test(text) && /<a\s+href/i.test(text));
    try {
      let arr, merge = false;
      if (isHtml) {
        arr = parseBookmarksHtml(text);
        merge = true;
      } else {
        const d = JSON.parse(text);
        arr = Array.isArray(d) ? d : d.links;
      }
      if (!Array.isArray(arr) || !arr.length) throw 0;
      const mapped = arr.filter(l => l && l.url).map(l => ({
        id: uid(),
        name: String(l.name || domain(String(l.url))).trim() || domain(String(l.url)),
        url: normUrl(String(l.url)),
        category: String(l.category || 'Tanpa Kategori').trim() || 'Tanpa Kategori',
      }));
      if (merge) {
        const existing = new Set(state.links.map(l => l.url.replace(/\/$/, '').toLowerCase()));
        const fresh = mapped.filter(l => !existing.has(l.url.replace(/\/$/, '').toLowerCase()));
        const dup = mapped.length - fresh.length;
        if (!fresh.length) {
          e.target.value = '';
          return toast('Semua bookmark dah ada dalam senarai');
        }
        if (!confirm(`Import ${fresh.length} bookmark dari browser?${dup ? ` (${dup} duplikat dilangkau)` : ''} Bookmark sedia ada dikekal.`)) return;
        state.links = [...fresh, ...state.links];
      } else {
        if (!confirm(`Import ${mapped.length} link? Data semasa akan diganti.`)) return;
        state.links = mapped;
      }
      save();
      render();
      toast('Import berjaya');
    } catch {
      alert('Fail tidak sah. Sila pilih fail backup BookmarkByME (.json) atau fail bookmarks HTML dari browser.');
    }
    e.target.value = '';
  };
  r.readAsText(f);
});

load();
render();
</script>
</body>
</html>
